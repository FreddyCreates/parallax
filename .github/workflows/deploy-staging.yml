name: Deploy to staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  MOPS_VERSION: '1.11.1'
  ICP_CLI_VERSION: '0.1.0-beta.3'
  TARGET_ENVIRONMENT: staging

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.mops
            ~/.cache/mops
            ~/.motoko
          key: ${{ runner.os }}-deploy-staging-backend-${{ hashFiles('mops.lock', 'mops.toml', 'src/backend/**/*.mo') }}
          restore-keys: |
            ${{ runner.os }}-deploy-staging-backend-
            ${{ runner.os }}-backend-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: npm install -g ic-mops@${{ env.MOPS_VERSION }}
      - working-directory: src/backend
        run: |
          set -euo pipefail
          mops install
          mops check --fix
          git diff --exit-code
          mops build

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - working-directory: src/frontend
        run: pnpm install --frozen-lockfile --prefer-offline
      - working-directory: src/frontend
        run: pnpm typecheck
      - working-directory: src/frontend
        run: pnpm build

  integration-gate:
    name: Integration gate
    runs-on: ubuntu-latest
    needs: [verify-backend, verify-frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: parralax_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      - working-directory: services/ai-service
        env:
          DATABASE_URL: mysql2://root:test@127.0.0.1:3306/parralax_test
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          pytest tests/integration/ -v --tb=short

  build-backend:
    name: Package backend artifact
    runs-on: ubuntu-latest
    needs: [integration-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.mops
            ~/.cache/mops
            ~/.motoko
          key: ${{ runner.os }}-deploy-staging-backend-build-${{ hashFiles('mops.lock', 'mops.toml', 'src/backend/**/*.mo') }}
          restore-keys: |
            ${{ runner.os }}-deploy-staging-backend-build-
            ${{ runner.os }}-backend-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: npm install -g ic-mops@${{ env.MOPS_VERSION }}
      - run: |
          set -euo pipefail
          (cd src/backend && mops install && mops build)
          pnpm bindgen
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backend-artifacts
          path: src/backend/dist
          retention-days: 14
          if-no-files-found: error

  build-frontend:
    name: Package frontend artifact
    runs-on: ubuntu-latest
    needs: [integration-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - working-directory: src/frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          if pnpm run | grep -q '^  build:skip-bindings'; then
            pnpm run build:skip-bindings
          else
            pnpm build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: staging-frontend-artifacts
          path: src/frontend/dist
          retention-days: 14
          if-no-files-found: error

  deploy-staging:
    name: Deploy to ICP staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-backend-artifacts
          path: src/backend/dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-frontend-artifacts
          path: src/frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ICP CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/download/v${{ env.ICP_CLI_VERSION }}/icp-cli-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure ICP identity
        env:
          ICP_IDENTITY_PEM: ${{ secrets.ICP_STAGING_IDENTITY_PEM }}
        run: |
          set -euo pipefail
          test -n "${ICP_IDENTITY_PEM:-}"
          mkdir -p ~/.config/icp
          printf '%s' "$ICP_IDENTITY_PEM" > ~/.config/icp/identity.pem
          chmod 600 ~/.config/icp/identity.pem

      - name: Write staging frontend environment
        run: |
          set -euo pipefail
          cat > src/frontend/dist/env.json <<EOF
          {
            "backend_host": "${{ secrets.STAGING_BACKEND_HOST || 'https://icp-api.io' }}",
            "backend_canister_id": "${{ secrets.STAGING_BACKEND_CANISTER_ID }}",
            "project_id": "${{ secrets.ICP_STAGING_PROJECT_ID }}",
            "ii_derivation_origin": "https://${{ secrets.STAGING_FRONTEND_CANISTER_ID }}.icp0.io"
          }
          EOF

      - name: Deploy backend canister
        run: |
          set -euo pipefail
          icp canister install --environment staging --wasm src/backend/dist/backend.wasm --mode upgrade backend

      - name: Deploy frontend canister
        run: |
          set -euo pipefail
          icp canister install --environment staging --mode upgrade frontend

      - name: Run staging health checks
        env:
          FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL || format('https://{0}.icp0.io', secrets.STAGING_FRONTEND_CANISTER_ID) }}
          BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL || format('https://{0}.raw.icp0.io', secrets.STAGING_BACKEND_CANISTER_ID) }}
        run: |
          set -euo pipefail
          sleep 10
          curl --fail --silent --show-error "$FRONTEND_URL" > /dev/null
          curl --fail --silent --show-error "$BACKEND_URL" > /dev/null

  notify:
    name: Notify Slack
    if: always()
    needs: [verify-backend, verify-frontend, integration-gate, build-backend, build-frontend, deploy-staging]
    uses: ./.github/workflows/notify-slack.yml
    with:
      workflow_name: deploy-staging
      run_status: ${{ needs.deploy-staging.result == 'success' && 'success' || 'failure' }}
      environment: staging
      summary: ${{ format('verify-backend={0}, verify-frontend={1}, integration={2}, deploy={3}', needs.verify-backend.result, needs.verify-frontend.result, needs.integration-gate.result, needs.deploy-staging.result) }}
      metrics: ${{ format('backend_artifact={0}; frontend_artifact={1}', 'staging-backend-artifacts', 'staging-frontend-artifacts') }}
    secrets: inherit
