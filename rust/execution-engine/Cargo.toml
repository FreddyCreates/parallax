[package]
name = "parralax-execution-engine"
version = "0.1.0"
edition = "2021"
description = "PARRALAX-AIHFTFUND HFT Execution Engine — low-latency order routing, risk gates, and execution receipts"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
dashmap = "5"
crossbeam-channel = "0.5"
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"

[[bench]]
name = "execution_bench"
harness = false
