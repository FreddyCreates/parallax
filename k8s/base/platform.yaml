---
# PARRALAX Platform — Kubernetes Deployment Manifests
# All production services: Rails API, Git Service, Rust Engine, AI Service, MySQL, Redis, ES, Kafka

apiVersion: v1
kind: Namespace
metadata:
  name: parralax
  labels:
    app.kubernetes.io/part-of: parralax-platform

---
# === RAILS API ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-api
  namespace: parralax
  labels:
    app: rails-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rails-api
  template:
    metadata:
      labels:
        app: rails-api
    spec:
      containers:
        - name: rails-api
          image: parralax/rails-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: RAILS_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rails-api
  namespace: parralax
spec:
  selector:
    app: rails-api
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

---
# === GIT SERVICE (Go) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-service
  namespace: parralax
  labels:
    app: git-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: git-service
  template:
    metadata:
      labels:
        app: git-service
    spec:
      containers:
        - name: git-service
          image: parralax/git-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: GIT_REPO_BASE_PATH
              value: "/var/lib/parralax/repos"
            - name: GIT_SERVICE_PORT
              value: "8082"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: git-storage
              mountPath: /var/lib/parralax/repos
      volumes:
        - name: git-storage
          persistentVolumeClaim:
            claimName: git-storage-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: git-service
  namespace: parralax
spec:
  selector:
    app: git-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP

---
# === RUST ENGINE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-engine
  namespace: parralax
  labels:
    app: rust-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-engine
  template:
    metadata:
      labels:
        app: rust-engine
    spec:
      containers:
        - name: rust-engine
          image: parralax/rust-engine:latest
          ports:
            - containerPort: 8083
          env:
            - name: RUST_LOG
              value: "info"
            - name: RUST_ENGINE_PORT
              value: "8083"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rust-engine
  namespace: parralax
spec:
  selector:
    app: rust-engine
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP

---
# === AI SERVICE (Python) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: parralax
  labels:
    app: ai-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: parralax/ai-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: anthropic-api-key
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: parralax
spec:
  selector:
    app: ai-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP

---
# === MYSQL 8.4 ===
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: parralax
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "parralax_production"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: parralax
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None

---
# === REDIS 7 ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: parralax
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: parralax
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# === ELASTICSEARCH 8.13 ===
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: parralax
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: parralax
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP

---
# === KAFKA (Confluent 7.6) ===
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: parralax
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: parralax
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
  clusterIP: None

---
# === HPA (Horizontal Pod Autoscaler) ===
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rails-api-hpa
  namespace: parralax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rails-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: parralax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
# === PodDisruptionBudget ===
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rails-api-pdb
  namespace: parralax
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rails-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-service-pdb
  namespace: parralax
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ai-service

---
# === NetworkPolicy ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: parralax
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: parralax
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: parralax-platform

---
# === Ingress ===
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parralax-ingress
  namespace: parralax
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.parralax.ai
        - git.parralax.ai
        - ai.parralax.ai
      secretName: parralax-tls
  rules:
    - host: api.parralax.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rails-api
                port:
                  number: 3001
    - host: git.parralax.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-service
                port:
                  number: 8082
    - host: ai.parralax.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8084
    - host: trade.parralax.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-api
                port:
                  number: 8000

---
# === EXECUTION ENGINE (Rust HFT) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-engine
  namespace: parralax
  labels:
    app: execution-engine
    tier: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-engine
  template:
    metadata:
      labels:
        app: execution-engine
        tier: trading
    spec:
      containers:
        - name: execution-engine
          image: parralax/execution-engine:latest
          ports:
            - containerPort: 8081
          env:
            - name: RUST_LOG
              value: "info"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: execution-engine
  namespace: parralax
spec:
  selector:
    app: execution-engine
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
# === TRADING API (Python) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-api
  namespace: parralax
  labels:
    app: trading-api
    tier: trading
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trading-api
  template:
    metadata:
      labels:
        app: trading-api
        tier: trading
    spec:
      containers:
        - name: trading-api
          image: parralax/trading-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parralax-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: trading-api
  namespace: parralax
spec:
  selector:
    app: trading-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
# === HPA for Trading Services ===
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-engine-hpa
  namespace: parralax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-api-hpa
  namespace: parralax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
# === PDB for Trading Services ===
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: execution-engine-pdb
  namespace: parralax
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: execution-engine

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-api-pdb
  namespace: parralax
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: trading-api

---
# === PROMETHEUS CONFIGURATION ===
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: parralax
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - prometheus.parralax.svc.cluster.local:9090

      - job_name: rails-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - rails-api.parralax.svc.cluster.local:3001

      - job_name: git-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - git-service.parralax.svc.cluster.local:8082

      - job_name: rust-engine
        metrics_path: /metrics
        static_configs:
          - targets:
              - rust-engine.parralax.svc.cluster.local:8083

      - job_name: ai-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - ai-service.parralax.svc.cluster.local:8084

      - job_name: execution-engine
        metrics_path: /metrics
        static_configs:
          - targets:
              - execution-engine.parralax.svc.cluster.local:8081

      - job_name: trading-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - trading-api.parralax.svc.cluster.local:8000

---
# === PROMETHEUS ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: parralax
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: parralax
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  type: ClusterIP

---
# === GRAFANA DATASOURCE PROVISIONING ===
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: parralax
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.parralax.svc.cluster.local:9090
        isDefault: true
        editable: false

---
# === GRAFANA ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: parralax
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3030"
          ports:
            - name: web
              containerPort: 3030
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
              subPath: prometheus.yaml
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: parralax
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 3030
      targetPort: 3030
  type: ClusterIP

---
# === MONITORING SERVICES FOR SERVICEMONITORS ===
apiVersion: v1
kind: Service
metadata:
  name: rails-api-metrics
  namespace: parralax
  labels:
    app: rails-api
    monitoring: prometheus
spec:
  selector:
    app: rails-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-metrics
  namespace: parralax
  labels:
    app: ai-service
    monitoring: prometheus
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: trading-api-metrics
  namespace: parralax
  labels:
    app: trading-api
    monitoring: prometheus
spec:
  selector:
    app: trading-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: execution-engine-metrics
  namespace: parralax
  labels:
    app: execution-engine
    monitoring: prometheus
spec:
  selector:
    app: execution-engine
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP

---
# === SERVICEMONITORS ===
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rails-api
  namespace: parralax
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - parralax
  selector:
    matchLabels:
      app: rails-api
      monitoring: prometheus
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

