[project]
name = "parralax-ai-service"
version = "1.0.0"
description = "PARRALAX AI Service — FastAPI with OpenAI + Anthropic LLM routing"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.14",
    "anthropic>=0.21",
    "redis>=5.0",
    "celery>=5.3",
    "structlog>=24.1",
    "orjson>=3.9",
    "prometheus-client>=0.20",
    "tiktoken>=0.6",
    "tenacity>=8.2",
    "python-jose[cryptography]>=3.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
