[package]
name = "parralax-rust-engine"
version = "1.0.0"
edition = "2021"
description = "PARRALAX Rust Engine — Tree-sitter parsing, LSP server, CRDT real-time collaboration"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tree-sitter parsing
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
# LSP
tower-lsp = "0.20"
lsp-types = "0.95"
# CRDT collaboration
yrs = "0.18"
# Networking
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"
# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
thiserror = "1"
anyhow = "1"
bytes = "1"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
tempfile = "3"

[[bench]]
name = "parser_bench"
harness = false
