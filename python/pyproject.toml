[project]
name = "parralax-aihftfund"
version = "0.1.0"
description = "PARRALAX-AIHFTFUND — Sovereign AI-Native Financial Execution Infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "httpx>=0.25",
    "websockets>=12.0",
    "pydantic>=2.5",
    "uvicorn>=0.24",
    "fastapi>=0.104",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "structlog>=23.2",
    "orjson>=3.9",
    "ccxt>=4.1",
    "ta-lib>=0.4; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "hypothesis>=6.92",
]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.2",
    "torch>=2.1",
    "scipy>=1.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
