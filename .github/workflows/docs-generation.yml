name: Documentation generation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-generation
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  MOPS_VERSION: '1.11.1'

jobs:
  build-docs:
    name: Generate API docs and static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Motoko and mops dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.mops
            ~/.cache/mops
            ~/.motoko
          key: ${{ runner.os }}-docs-${{ hashFiles('mops.lock', 'mops.toml', 'src/backend/**/*.mo') }}
          restore-keys: |
            ${{ runner.os }}-docs-
            ${{ runner.os }}-backend-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install mops
        run: npm install -g ic-mops@${{ env.MOPS_VERSION }}

      - name: Build backend API definition
        run: |
          set -euo pipefail
          (cd src/backend && mops install && mops build)
          pnpm bindgen

      - name: Generate static docs site
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import shutil
          from pathlib import Path

          site = Path('site')
          docs_root = Path('docs')
          site.mkdir(exist_ok=True)
          (site / 'docs').mkdir(exist_ok=True)
          (site / 'api').mkdir(exist_ok=True)
          markdown_files = sorted(docs_root.rglob('*.md'))
          yaml_files = sorted(docs_root.rglob('*.yaml'))
          diagrams = []

          for source in markdown_files + yaml_files:
              relative = source.relative_to(docs_root)
              destination = site / 'docs' / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              text = source.read_text(encoding='utf-8')
              if '```mermaid' in text or source.suffix == '.yaml':
                  diagrams.append(str(relative))

          did_file = Path('src/backend/dist/backend.did')
          if did_file.exists():
              escaped = html.escape(did_file.read_text(encoding='utf-8'))
              (site / 'api' / 'backend.did.html').write_text(
                  '<html><body><h1>backend.did</h1><pre>' + escaped + '</pre></body></html>',
                  encoding='utf-8',
              )

          links = '\n'.join(
              f'<li><a href="docs/{path.as_posix()}">{path.as_posix()}</a></li>'
              for path in [p.relative_to(docs_root) for p in markdown_files + yaml_files]
          )
          index = f'''<html><body><h1>PARALLAX Documentation</h1><p>Static docs generated from the repository.</p><h2>Repository docs</h2><ul>{links}</ul><h2>API docs</h2><ul><li><a href="api/backend.did.html">backend.did</a></li></ul></body></html>'''
          (site / 'index.html').write_text(index, encoding='utf-8')
          (site / 'diagram-index.json').write_text(json.dumps({'diagrams': diagrams}, indent=2), encoding='utf-8')
          PY

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 14
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-docs]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify Slack
    if: always()
    needs: [build-docs, deploy-pages]
    uses: ./.github/workflows/notify-slack.yml
    with:
      workflow_name: docs-generation
      run_status: ${{ needs.build-docs.result == 'success' && needs.deploy-pages.result == 'success' && 'success' || 'failure' }}
      environment: docs
      summary: ${{ format('build-docs={0}, deploy-pages={1}', needs.build-docs.result, needs.deploy-pages.result) }}
      metrics: docs_site=site
    secrets: inherit
