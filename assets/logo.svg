<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd200;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#grad1)"/>
  
  <!-- Parallax lines (visual motif) -->
  <line x1="30" y1="40" x2="130" y2="40" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <line x1="25" y1="55" x2="135" y2="55" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="35" y1="70" x2="125" y2="70" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  
  <!-- Geometric icon (diamond/crystal shape representing execution precision) -->
  <polygon points="80,85 105,120 80,155 55,120" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <polygon points="80,95 95,120 80,145 65,120" fill="url(#accent)" opacity="0.3"/>
  <circle cx="80" cy="120" r="8" fill="url(#gold)" opacity="0.9"/>
  
  <!-- Pulse lines from center -->
  <line x1="30" y1="160" x2="130" y2="160" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <line x1="25" y1="145" x2="135" y2="145" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Main Title -->
  <text x="170" y="110" font-family="'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">PARRALAX</text>
  
  <!-- Subtitle -->
  <text x="170" y="145" font-family="'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="url(#accent)">AI HFT FUND</text>
  
  <!-- Tagline -->
  <text x="170" y="172" font-family="'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="13" font-weight="300" fill="#8892b0" letter-spacing="2">SOVEREIGN AI-NATIVE FINANCIAL INFRASTRUCTURE</text>
  
  <!-- Right side decorative data viz -->
  <g opacity="0.5">
    <!-- Mini candlestick chart -->
    <rect x="620" y="70" width="4" height="40" fill="#00d2ff" rx="1"/>
    <rect x="632" y="55" width="4" height="55" fill="#00d2ff" rx="1"/>
    <rect x="644" y="80" width="4" height="30" fill="#7b2ff7" rx="1"/>
    <rect x="656" y="60" width="4" height="50" fill="#00d2ff" rx="1"/>
    <rect x="668" y="45" width="4" height="65" fill="#00d2ff" rx="1"/>
    <rect x="680" y="75" width="4" height="35" fill="#7b2ff7" rx="1"/>
    <rect x="692" y="50" width="4" height="60" fill="#00d2ff" rx="1"/>
    <rect x="704" y="65" width="4" height="45" fill="#00d2ff" rx="1"/>
    <rect x="716" y="40" width="4" height="70" fill="url(#gold)" rx="1"/>
    <rect x="728" y="55" width="4" height="55" fill="#00d2ff" rx="1"/>
    <rect x="740" y="35" width="4" height="75" fill="url(#gold)" rx="1"/>
    <rect x="752" y="50" width="4" height="60" fill="#00d2ff" rx="1"/>
  </g>
  
  <!-- Network nodes -->
  <g opacity="0.4">
    <circle cx="640" cy="150" r="3" fill="#00d2ff"/>
    <circle cx="680" cy="140" r="3" fill="#7b2ff7"/>
    <circle cx="720" cy="155" r="3" fill="#00d2ff"/>
    <circle cx="760" cy="145" r="3" fill="#ffd200"/>
    <line x1="640" y1="150" x2="680" y2="140" stroke="#00d2ff" stroke-width="0.5"/>
    <line x1="680" y1="140" x2="720" y2="155" stroke="#7b2ff7" stroke-width="0.5"/>
    <line x1="720" y1="155" x2="760" y2="145" stroke="#00d2ff" stroke-width="0.5"/>
  </g>
</svg>
